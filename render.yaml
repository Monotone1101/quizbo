# Render Blueprint — the whole stack in one go (Dashboard → New → Blueprint → pick this repo).
#
# Render prompts for three values on the first deploy:
#   NEXT_PUBLIC_BATTLE_URL  https://quizbo-battle.onrender.com   (read at web BUILD time)
#   WEB_ORIGIN              https://quizbo-web.onrender.com
#   GEMINI_API_KEY          your Google AI Studio key (optional — the app degrades gracefully without it)
# Guess the two URLs from the service names below; Render assigns exactly those unless the name is taken.
#
# Plans: `free` everywhere, so this costs nothing to try. Free services sleep after 15 minutes idle and
# take ~30 s to wake, and a free database is deleted after 30 days. For a real launch change both web
# services to `plan: starter` and the database to `plan: basic-256mb`.
#
# See DEPLOY.md for custom domains, Google/email sign-in, and the optional worker.

envVarGroups:
  - name: quizbo-shared
    envVars:
      # Signed battle tokens: the web app signs, the battle service verifies. Both read it from here,
      # so the two always agree.
      - key: BATTLE_JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      # Newer models are often "busy" (503) on the free tier; this one answers reliably.
      - key: QUIZBO_GEMINI_MODEL
        value: gemini-3.6-flash

databases:
  - name: quizbo-db
    databaseName: quizbo
    user: quizbo
    plan: free

services:
  - type: web
    name: quizbo-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @quizbo/web
    # Migrations and the seed run here rather than in a preDeployCommand, which needs a paid plan.
    # Both are idempotent: `migrate deploy` skips applied migrations and the seed upserts, so a restart
    # costs a few seconds and changes nothing.
    startCommand: npm run migrate:deploy -w @quizbo/db && npm run seed -w @quizbo/db && npm run start -w @quizbo/web
    healthCheckPath: /signin
    envVars:
      - fromGroup: quizbo-shared
      - key: DATABASE_URL
        fromDatabase: { name: quizbo-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_DEMO_LOGIN
        value: "true"
      # Inlined into the browser bundle at build time — changing it needs a rebuild, not just a restart.
      - key: NEXT_PUBLIC_BATTLE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: quizbo-battle
    runtime: node
    plan: free
    # One instance keeps rooms and the queue in memory. To run several, move to a paid plan, set
    # BATTLE_REDIS_URL (see the commented Key Value block below) and add `numInstances` — see
    # DEPLOY.md, "Scaling the battle service".
    # --omit=dev skips build-only packages, including the local PostgreSQL used in development.
    buildCommand: npm ci --omit=dev
    startCommand: npm run start -w @quizbo/battle
    healthCheckPath: /healthz
    envVars:
      - fromGroup: quizbo-shared
      - key: DATABASE_URL
        fromDatabase: { name: quizbo-db, property: connectionString }
      # Origins allowed to open a socket. Add your custom domain here as a second, comma-separated value.
      - key: WEB_ORIGIN
        sync: false

